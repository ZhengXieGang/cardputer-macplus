; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   This project only builds application binaries. Upload is intentionally
;   blocked because PlatformIO would replace the user's Launcher partition
;   table. Use the direct esptool commands in README.md instead.
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:cardputer-adv-launcher]
platform = espressif32@6.10.0
board = esp32-s3-devkitc-1
framework = arduino
monitor_speed = 115200
board_build.flash_size = 8MB
board_build.partitions = .pio/generated/partitions-launcher.csv
extra_scripts = pre:tools/generate_partitions.py
board_upload.flash_size = 8MB
build_flags = 
	-DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DCORE_DEBUG_LEVEL=0
    -Isrc
    -Isrc/tme
    -Isrc/tme/musashi
build_src_filter =
    +<*>
    -<installdisk.cpp>
    -<tme/musashi/m68k_in.c>
    -<tme/musashi/m68kops.c>
lib_deps = 
	M5Cardputer=https://github.com/m5stack/M5Cardputer.git
lib_ignore = 
	IRremote
upload_port = /dev/invalid-cardputer-port
monitor_port = /dev/ttyACM1
upload_protocol = esptool
upload_speed = 230400
platform_packages = platformio/tool-esptoolpy@^2.41100.0

