	-DARDUINO_USB_CDC_ON_BOOT=1
	-DCORE_DEBUG_LEVEL=0
	-Isrc
	-Isrc/tme
	-Isrc/tme/musashi
build_src_filter =
	+<*>
	-<installdisk.cpp>
	-<tme/musashi/m68k_in.c>
	-<tme/musashi/m68kops.c>
lib_deps =
